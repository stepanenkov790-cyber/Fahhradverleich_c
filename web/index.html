<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fahrradverleih</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>Fahrradverleih</strong><nav><a href="#dashboard">Dashboard</a><a href="#bikes">Fahrräder</a><a href="#customers">Kunden</a><a href="#rentals">Verleih</a><a href="#reservations">Reservierungen</a></nav></header>
<main>
<section id="dashboard"><h1>Dashboard</h1><div class="cards"><div class="card purple"><span>Verfügbare Fahrräder</span><b id="available">0</b></div><div class="card pink"><span>Ausgeliehene Fahrräder</span><b id="rented">0</b></div><div class="card blue"><span>Gesamt Fahrräder</span><b id="total">0</b></div><div class="card green"><span>Registrierte Kunden</span><b id="customersCount">0</b></div></div></section>
<section id="bikes"><h2>Fahrradverwaltung</h2><form id="bikeForm"><input name="name" placeholder="Name des Fahrrads" required><input name="type" placeholder="Typ (z.B. Citybike)" required><input name="size" placeholder="Größe" required><input name="dailyPrice" type="number" min="0.01" step="0.01" placeholder="Preis pro Tag (€)" required><button>+ Fahrrad hinzufügen</button></form><div id="bikeList"></div></section>
<section id="customers"><h2>Kundenverwaltung</h2><form id="customerForm"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="E-Mail" required><button>+ Kunde hinzufügen</button></form><div id="customerList"></div></section>
<section id="rentals"><h2>Neuer Verleih</h2><form id="rentalForm"><select name="bikeId" id="rentalBike" required></select><select name="customerId" id="rentalCustomer" required></select><input name="date" type="date" required><input name="days" type="number" min="1" max="365" value="1" required><button>Verleih speichern</button></form><div id="rentalList"></div></section>
<section id="reservations"><h2>Reservierungen</h2><form id="reservationForm"><select name="bikeId" id="reservationBike" required></select><select name="customerId" id="reservationCustomer" required></select><input name="date" type="date" required><button>Reservierung erstellen</button></form><div id="reservationList"></div></section>
</main><script src="app.js"></script></body></html>
